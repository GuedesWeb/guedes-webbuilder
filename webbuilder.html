<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guedes WebBuilder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="templates-data.js"></script>
<style>
/* ============ DESIGN SYSTEM — Pulsedesk-Inspired ============ */
:root{
--bg:#080c14;--bg2:#0d1220;--bg3:rgba(255,255,255,.04);--bg-input:rgba(255,255,255,.03);
--border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.12);
--text:rgba(255,255,255,.65);--dim:rgba(255,255,255,.35);--bright:#FFFFFF;
--accent:#4C43F7;--accent-hover:#6359FF;--accent-glow:rgba(76,67,247,.2);
--secondary:#56D9DF;--cyan-glow:rgba(86,217,223,.15);
--green:#20C997;--warning:#F59E0B;--error:#EF4444;
--r:12px;--r-card:20px;--r-btn:9999px;--r-modal:24px;
--font:'Inter',system-ui,-apple-system,sans-serif;
--shadow-card:0 1px 0 rgba(255,255,255,.04),0 4px 24px rgba(0,0,0,.3);
--shadow-glow:0 0 60px rgba(76,67,247,.1);
--transition:200ms cubic-bezier(.4,0,.2,1);
--max-w:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--accent);text-decoration:none}

/* ============ ATMOSPHERE ============ */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
background:radial-gradient(circle at 50% -10%,rgba(88,166,255,.08),transparent 36%),
radial-gradient(circle at 82% 18%,rgba(103,232,249,.04),transparent 28%),
linear-gradient(180deg,#0b1020 0%,#080c14 42%,#0a0d13 100%);}

/* ============ BUTTONS ============ */
.btn{padding:11px 22px;border-radius:var(--r-btn);border:none;cursor:pointer;font-family:var(--font);font-weight:500;font-size:13px;transition:all var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.01em}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(76,67,247,.25)}
.btn-p:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 24px rgba(76,67,247,.35)}
.btn-p:active{transform:translateY(0)}
.btn-s{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-s:hover{background:var(--bg3);border-color:var(--border-hover);color:var(--bright)}
.btn-e{background:var(--green);color:#000;font-weight:600}
.btn-e:hover{background:#34D9A0;transform:translateY(-1px);box-shadow:0 8px 24px rgba(32,201,151,.2)}
.btn-sm{padding:7px 14px;font-size:11px}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:rgba(8,12,20,.8);border-bottom:1px solid var(--border);flex-shrink:0;gap:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.toolbar-brand{font-weight:600;font-size:14px;color:var(--bright);white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.toolbar-brand::before{content:'';display:block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(76,67,247,.6)}

/* ============ STEPS (STEPPER) ============ */
.steps{display:flex;gap:4px;padding:0 24px;height:44px;align-items:center;background:rgba(8,12,20,.6);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;backdrop-filter:blur(12px)}
.step{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;color:var(--dim);white-space:nowrap;transition:all var(--transition);flex-shrink:0;letter-spacing:.02em}
.step .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--border);transition:all var(--transition)}
.step:hover{color:var(--text);background:rgba(255,255,255,.03)}
.step.active{color:var(--bright);background:rgba(76,67,247,.1)}
.step.active .num{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 12px rgba(76,67,247,.4)}
.step.done{color:var(--green)}.step.done .num{background:rgba(32,201,151,.2);border-color:var(--green);color:var(--green)}

/* ============ MAIN ============ */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* ============ PREVIEW ============ */
.preview{flex:1;display:flex;flex-direction:column;background:#060a10;min-width:0;position:relative}
.preview-bar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:rgba(13,18,32,.6);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;opacity:.8}
.pdot.r{background:#FF5F57}.pdot.y{background:#FEBC2E}.pdot.g{background:#28C840}
.purl{flex:1;padding:4px 12px;background:rgba(255,255,255,.03);border-radius:6px;font-size:11px;color:var(--dim);text-align:center;overflow:hidden;white-space:nowrap;border:1px solid var(--border)}
.szbtns{display:flex;gap:3px}
.szbtns button{padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:11px;font-family:var(--font);transition:all var(--transition)}
.szbtns button:hover{background:var(--bg3);color:var(--text)}
.szbtns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pwrap{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;background:#0d1117;padding:28px}
.pwrap iframe{border:none;background:#fff;border-radius:6px;transition:all var(--transition);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 80px rgba(0,0,0,.5)}

/* ============ PANEL ============ */
.panel{width:460px;background:rgba(13,18,32,.5);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel-content{flex:1;overflow-y:auto;padding:28px 24px}
.panel-content::-webkit-scrollbar{width:4px}
.panel-content::-webkit-scrollbar-track{background:transparent}
.panel-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:8px}
.panel-nav{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--border);flex-shrink:0;background:rgba(13,18,32,.6);backdrop-filter:blur(12px)}
.panel-nav button{flex:1}

/* ============ SETUP CENTERED CARD ============ */
.setup-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;overflow-y:auto}
.setup-card{width:100%;max-width:600px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-card);padding:40px;box-shadow:var(--shadow-card)}
.setup-card .step-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.setup-card .step-desc{text-align:center;margin-bottom:32px;font-size:14px;color:var(--dim)}
.setup-card .sec-hdr{font-size:12px;margin:28px 0 14px;padding-top:20px}
.setup-card .sec-hdr:first-child{margin-top:0;padding-top:0}

/* ============ FORM ELEMENTS ============ */
.fg{margin-bottom:16px}
.fl{display:block;font-weight:500;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fi{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r);color:var(--bright);font-family:var(--font);font-size:13px;transition:all var(--transition);outline:none}
.fi::placeholder{color:var(--dim)}
.fi:hover{border-color:var(--border-hover)}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
textarea.fi{resize:vertical;min-height:60px;line-height:1.7}

/* ============ COLORS ============ */
.colors-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.color-dot{width:38px;height:38px;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:all var(--transition)}
.color-dot:hover{transform:scale(1.12);border-color:var(--bright)}
.color-dot.sel{border-color:var(--bright);box-shadow:0 0 20px rgba(255,255,255,.15)}
.color-pick{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 14px;background:rgba(255,255,255,.02);border-radius:var(--r);border:1px solid var(--border);transition:all var(--transition)}
.color-pick:hover{border-color:var(--border-hover)}
.color-pick input[type=color]{width:32px;height:32px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;background:none;padding:2px}
.color-pick .cn{flex:1;font-size:12px;font-weight:500;color:var(--text)}
.color-pick .cv{font-size:11px;font-family:'SF Mono','Fira Code',monospace;color:var(--dim);background:var(--bg-input);padding:2px 8px;border-radius:4px}

/* ============ IMAGE PREVIEW ============ */
.img-prev{width:100%;height:52px;object-fit:contain;background:rgba(0,0,0,.3);border-radius:8px;margin-top:6px;border:1px solid var(--border)}
.img-prev:not([src]){display:none}
.upload-btn{cursor:pointer;padding:7px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r);font-size:11px;font-weight:500;color:var(--dim);display:inline-flex;align-items:center;gap:5px;transition:all var(--transition)}
.upload-btn:hover{border-color:var(--accent);color:var(--bright);background:rgba(76,67,247,.06)}
.upload-btn input{display:none}

/* ============ SECTIONS ============ */
.sec-hdr{font-weight:600;font-size:11px;color:var(--secondary);margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em}
.sec-hdr:first-child{margin-top:0;padding-top:0;border-top:none}

.step-title{font-weight:700;font-size:20px;color:var(--bright);margin-bottom:6px;letter-spacing:-.02em}
.step-desc{font-size:13px;color:var(--dim);margin-bottom:24px;line-height:1.6}
.elfsight-guide{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;margin-bottom:16px;font-size:12px;line-height:1.7;color:var(--dim)}
.elfsight-guide strong{color:var(--bright)}
.elfsight-guide ol{margin:8px 0 0 18px}
.elfsight-guide li{margin-bottom:5px}
.elfsight-guide a{color:var(--secondary)}

/* ============ ANIMATIONS ============ */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.panel-content>*{animation:fadeIn 250ms ease-out}
.setup-card{animation:scaleIn 300ms ease-out}
</style>
</head>
<body>

<div class="toolbar">
<div class="toolbar-brand">🛠️ Guedes WebBuilder</div>
<div style="display:flex;gap:8px;align-items:center">
</div>
</div>

<div class="steps" id="stepsBar"></div>

<div class="main">
<div class="preview">
<div class="preview-bar">
<span class="pdot r"></span><span class="pdot y"></span><span class="pdot g"></span>
<span class="purl" id="previewLabel">Landing Page</span>
<div class="szbtns">
<button class="on" onclick="setSize('100%',this)">💻</button>
<button onclick="setSize('768px',this)">📲</button>
<button onclick="setSize('375px',this)">📱</button>
</div>
</div>
<div class="pwrap" id="previewWrap"><iframe id="previewFrame" src="about:blank" style="width:100%;height:100%"></iframe></div>
</div>

<div class="panel">

</div>

<script>
// ==================== STATE ====================
const STEPS=[
{id:'boasvindas',icon:'👋',label:'Boas-vindas'},
{id:'setup',icon:'🚀',label:'Pré-Configuração'},
{id:'identidade',icon:'🏷️',label:'Identidade'},
{id:'cores',icon:'🎨',label:'Cores'},
{id:'textos',icon:'📝',label:'Textos'},
{id:'contato',icon:'🔗',label:'Contato'},
{id:'imagens',icon:'🖼️',label:'Imagens'},
{id:'avaliacoes',icon:'⭐',label:'Avaliações'},
{id:'planos',icon:'💎',label:'Planos'},
{id:'publicar',icon:'🚀',label:'Publicar'},
];
let currentPage='landing',currentStep=0,setupSubStep=0,setupCache={};
let templateData={landing:null,planos:null};
let edits={landing:{cores:{},imagens:{},textos:{},links:{}},planos:{cores:{},imagens:{},textos:{},links:{}}};
let customCode={head:'',bodyStart:'',footer:''};
let isAdmin=false;

const colorDefs=[
{key:'cor-fundo',label:'Fundo da página'},
{key:'cor-superficie',label:'Fundo de cards/seções'},
{key:'cor-escuro',label:'Títulos, CTA, footer'},
{key:'cor-medio',label:'Botões principais'},
{key:'cor-acento',label:'Detalhes e links'},
{key:'cor-texto',label:'Texto principal'},
{key:'cor-texto-suave',label:'Texto secundário'},
{key:'cor-borda',label:'Bordas e linhas'},
];
const colorPresets=[
{name:'Original',colors:{'cor-fundo':'#FBF7F2','cor-superficie':'#FFFFFF','cor-escuro':'#3A2D28','cor-medio':'#5C4033','cor-acento':'#C17B5E','cor-texto':'#2C2420','cor-texto-suave':'#7A6E66','cor-borda':'#E8E0D8'}},
{name:'Sálvia',colors:{'cor-fundo':'#F6F8F5','cor-superficie':'#FFFFFF','cor-escuro':'#2D3830','cor-medio':'#4A6B52','cor-acento':'#8BA88A','cor-texto':'#252E27','cor-texto-suave':'#5E6B60','cor-borda':'#DCE5DC'}},
{name:'Azul',colors:{'cor-fundo':'#F5F7FA','cor-superficie':'#FFFFFF','cor-escuro':'#1D2B3A','cor-medio':'#2E4868','cor-acento':'#D4896A','cor-texto':'#1D2B3A','cor-texto-suave':'#5A6B7E','cor-borda':'#D8E0E8'}},
{name:'Lavanda',colors:{'cor-fundo':'#FBFAFD','cor-superficie':'#FFFFFF','cor-escuro':'#2D2540','cor-medio':'#5E4D7A','cor-acento':'#C48B9E','cor-texto':'#2D2540','cor-texto-suave':'#6D5E85','cor-borda':'#DDD5ED'}},
{name:'Terracota',colors:{'cor-fundo':'#FDF9F6','cor-superficie':'#FFFFFF','cor-escuro':'#3D2518','cor-medio':'#8B5540','cor-acento':'#D4956A','cor-texto':'#3D2518','cor-texto-suave':'#7A5E50','cor-borda':'#EAD5C8'}},
{name:'Dark',colors:{'cor-fundo':'#1A1A1A','cor-superficie':'#242424','cor-escuro':'#C4A97D','cor-medio':'#8B7355','cor-acento':'#D4785C','cor-texto':'#E0E0E0','cor-texto-suave':'#999','cor-borda':'#333'}},
];
const defaults={landing:JSON.parse(JSON.stringify(colorPresets[0].colors)),planos:JSON.parse(JSON.stringify(colorPresets[0].colors))};

// ==================== COLOR HELPERS ====================
function hexToHSL(hex){
let r=0,g=0,b=0;hex=hex.replace('#','');
if(hex.length===3){r=parseInt(hex[0]+hex[0],16);g=parseInt(hex[1]+hex[1],16);b=parseInt(hex[2]+hex[2],16);}
else{r=parseInt(hex.substring(0,2),16);g=parseInt(hex.substring(2,4),16);b=parseInt(hex.substring(4,6),16);}
r/=255;g/=255;b/=255;
const max=Math.max(r,g,b),min=Math.min(r,g,b);
let h=0,s=0,l=(max+min)/2;
if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}
return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}
function hslToHex(h,s,l){
s/=100;l/=100;const a=s*Math.min(l,1-l);
const f=n=>{const k=(n+h/30)%12;const color=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*color).toString(16).padStart(2,'0');};
return `#${f(0)}${f(8)}${f(4)}`;
}
function getLuminance(hex){
hex=hex.replace('#','');
if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
const r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16);
return (0.299*r+0.587*g+0.114*b)/255;
}
function lightenColor(hex,amount){
const hsl=hexToHSL(hex);hsl.l=Math.min(100,hsl.l+amount*100);return hslToHex(hsl.h,hsl.s,hsl.l);
}
function darkenColor(hex,amount){
const hsl=hexToHSL(hex);hsl.l=Math.max(0,hsl.l-amount*100);return hslToHex(hsl.h,hsl.s,hsl.l);
}
function autoPalette(c1,c2,c3){
const colors=[{hex:c1,lum:getLuminance(c1)},{hex:c2,lum:getLuminance(c2)},{hex:c3,lum:getLuminance(c3)}];
colors.sort((a,b)=>a.lum-b.lum);
const dark=colors[0].hex,mid=colors[1].hex,light=colors[2].hex;
return{
'cor-fundo':lightenColor(light,0.08),
'cor-superficie':'#FFFFFF',
'cor-escuro':dark,
'cor-medio':mid,
'cor-acento':mid,
'cor-texto':dark,
'cor-texto-suave':lightenColor(dark,0.45),
'cor-borda':lightenColor(mid,0.35),
};
}

function toggleReviewsGuide(){

const guide=document.getElementById('su-reviews-guide');
if(cb&&guide){guide.style.display=cb.checked?'block':'none';}
}

// ==================== PHONE MASK ====================
// ==================== DOMÍNIO & ASAAS ====================
async function checkDomain(){
let domain=document.getElementById('pub-domain')?.value.trim();
if(!domain){alert('Digite um domínio (ex: nomedoestudio.com)');return;}
const resultDiv=document.getElementById('pub-domain-result');

// Vercel NÃO vende .com.br — força TLD compatível
const vercelTLDs=['.com','.net','.org','.dev','.app','.io','.co','.ai','.me','.tv','.xyz','.sh','.info'];
domain=domain.toLowerCase().replace(/\s/g,'');
const hasTLD=vercelTLDs.some(t=>domain.endsWith(t));
if(!hasTLD){
const base=domain.includes('.')?domain.split('.')[0]:domain;
const sugs=vercelTLDs.slice(0,6).map(t=>base+t);
resultDiv.innerHTML='<p style="font-size:11px;color:var(--error);margin-bottom:8px">⚠️ A Vercel não vende <strong>.com.br</strong> nem essa terminação.</p><p style="font-size:11px;color:var(--dim);margin-bottom:4px">Extensões disponíveis:</p>'+sugs.map(s=>'<button class="btn btn-s btn-sm" style="margin:3px" onclick="document.getElementById(\'pub-domain\').value=\''+s+'\';checkDomain();">'+s+'</button>').join('')+'<p style="font-size:10px;color:var(--dim);margin-top:6px">🔗 O domínio .com.br pode ser comprado no Registro.br e apontado manualmente.</p>';
return;
}

resultDiv.innerHTML='<p style="font-size:11px;color:var(--dim)">🔍 Verificando '+esc(domain)+'...</p>';

// Tenta verificação via DNS Google + Vercel API
let available=false;let checked=false;

// 1. DNS lookup (gratuito, funciona pra qualquer TLD)
if(!checked){
try{
const dnsRes=await fetch('https://dns.google/resolve?name='+encodeURIComponent(domain)+'&type=A');
const dnsJson=await dnsRes.json();
if(!dnsJson.Answer||dnsJson.Answer.length===0){
available=true;checked=true;
}else{
checked=true;
resultDiv.innerHTML='<p style="font-size:11px;color:var(--error)">❌ <strong>'+esc(domain)+'</strong> já está registrado (DNS encontrado).</p>';
return;
}
}catch(e){}
}

// 3. Tenta Vercel API como fallback
if(!checked){
try{
const token=localStorage.getItem('vercel_token')||'';
const res=await fetch('https://api.vercel.com/v4/domains/status?name='+encodeURIComponent(domain),{
headers:{'Authorization':'Bearer '+token}
});
if(res.ok){
const json=await res.json();
if(json.available){available=true;checked=true;}
else{resultDiv.innerHTML='<p style="font-size:11px;color:var(--error)">❌ <strong>'+esc(domain)+'</strong> já está registrado.</p>';return;}
}
}catch(e){}
}

if(available){
resultDiv.innerHTML='<div style="background:rgba(32,201,151,.06);border:1px solid rgba(32,201,151,.15);border-radius:var(--r);padding:14px 16px;margin-top:6px"><p style="font-size:12px;color:var(--green);margin-bottom:6px">✅ <strong>'+esc(domain)+'</strong> está disponível!</p><p style="font-size:12px;color:var(--text);margin-bottom:12px">💰 <strong>R$ 79,90/ano</strong> — Compra e configuração automática</p><button class="btn btn-p btn-sm" onclick="buyDomainVercel(\''+esc(domain)+'\')" style="width:100%;margin-bottom:6px">🛒 Comprar e Configurar Domínio</button><p style="font-size:10px;color:var(--dim)">Pagamento via Asaas. Após confirmação, o domínio é registrado e linkado ao site automaticamente.</p></div>';
}else if(!checked){
resultDiv.innerHTML='<p style="font-size:11px;color:var(--warning)">⚠️ Não foi possível verificar <strong>'+esc(domain)+'</strong>. Verifique o formato (ex: nomedoestudio.com.br) e sua conexão.</p>';
}
}

async function buyDomainVercel(domain){
const vercelToken=localStorage.getItem('vercel_token')||'';

function copyLink(inputId){
const input=document.getElementById(inputId);
if(!input)return;
input.select();input.setSelectionRange(0,99999);
navigator.clipboard.writeText(input.value).then(()=>{
const btn=input.nextElementSibling;
if(btn){const orig=btn.textContent;btn.textContent='✅ Copiado!';setTimeout(()=>btn.textContent=orig,1500);}
}).catch(()=>{alert('Link: '+input.value);});
}

function phoneMask(input){
let v=input.value.replace(/\D/g,'');
if(v.length>11)v=v.substring(0,11);
if(v.length>0){
if(v.length<=2){v='('+v;}
else if(v.length<=7){v='('+v.substring(0,2)+') '+v.substring(2);}
else{v='('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7);}
}
input.value=v;
}
function phoneMaskDisplay(raw){
if(!raw)return'';
const v=raw.replace(/\D/g,'');
if(v.length<=2)return'('+v;
if(v.length<=7)return'('+v.substring(0,2)+') '+v.substring(2);
return'('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7,11);
}
function phoneStripMasked(input){
return input?input.value.replace(/\D/g,''):'';
}
function phoneFormatDisplay(raw){
if(!raw)return'';
const v=raw.replace(/\D/g,'');
if(v.length<=2)return'('+v;
if(v.length<=7)return'('+v.substring(0,2)+') '+v.substring(2);
return'('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7,11);
}

function init(){
if(typeof TEMPLATES==='undefined'){alert('templates-data.js não encontrado!');return}
templateData.landing=TEMPLATES.get('landing');templateData.planos=TEMPLATES.get('planos');
if(!templateData.landing||!templateData.planos){alert('Erro nos templates!');return}
edits.landing.cores=JSON.parse(JSON.stringify(defaults.landing));
edits.planos.cores=JSON.parse(JSON.stringify(defaults.planos));
parseFields('landing');parseFields('planos');
buildStepsBar();
checkAdminMode().then(function(){if(isAdmin)renderStep();});
renderStep();updatePreview();
}

function parseFields(page){
const parser=new DOMParser();const doc=parser.parseFromString(templateData[page],'text/html');
const e=edits[page];e.imagens={};e.textos={};e.links={};
doc.querySelectorAll('[data-editable]').forEach(el=>{
const key=el.getAttribute('data-editable');if(!key)return;
if(el.tagName==='IMG'){e.imagens[key]=el.getAttribute('src')||'';return;}
if(el.tagName==='A'&&el.hasAttribute('href')){e.links[key]=el.getAttribute('href')||'';
if(el.hasAttribute('data-editable-text'))e.textos[el.getAttribute('data-editable-text')]=el.textContent.trim();return;}
if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){e.textos[key]=el.getAttribute('value')||el.value||'';return;}
if(el.hasAttribute('data-editable-text')){e.textos[el.getAttribute('data-editable-text')]=el.textContent.trim();}
else{e.textos[key]=el.textContent.trim();}
});
doc.querySelectorAll('[data-editable-bg]').forEach(el=>{const k=el.getAttribute('data-editable-bg');if(k&&!e.imagens[k])e.imagens[k]='';});
doc.querySelectorAll('[data-editable-html]').forEach(el=>{const k=el.getAttribute('data-editable-html');if(k)e.textos[k]=el.innerHTML.trim();});
}

// ==================== STEPS BAR ====================
function buildStepsBar(){
const bar=document.getElementById('stepsBar');
bar.innerHTML=STEPS.map((s,i)=>`<div class="step" id="step${i}" onclick="goToStep(${i})"><span class="num">${i+1}</span>${s.icon} ${s.label}</div>`).join('');
}

function updateStepsBar(){
STEPS.forEach((s,i)=>{
const el=document.getElementById('step'+i);
el.classList.remove('active','done');
if(i===currentStep)el.classList.add('active');
else if(i<currentStep)el.classList.add('done');
});
document.getElementById('btnPrev').style.display=currentStep===0?'none':'flex';
const isLast=currentStep===STEPS.length-1;
document.getElementById('btnNext').style.display=isLast?'none':'flex';
document.getElementById('btnNext').textContent='Próximo →';
}

function goToStep(i){
	currentStep=i;
	if(i===1)setupSubStep=0;
	// Auto-switch page tab when entering/leaving planos step
	if(i===8){currentPage='planos';}
	else if(currentPage==='planos'){currentPage='landing';}
	renderStep();updateStepsBar();
}
function nextStep(){
		if(currentStep===0){
			goToStep(1);return;
		}
		if(currentStep===1){
			applySetup();return;
		}
	
	if(currentStep<STEPS.length-1){currentStep++;
		if(currentStep===8){currentPage='planos';}
		else if(currentPage==='planos'){currentPage='landing';}
		renderStep();updateStepsBar();
	}else{exportAll()}
}
function prevStep(){
	if(currentStep>0){currentStep--;
		if(currentStep===8){currentPage='planos';}
		else if(currentPage==='planos'){currentPage='landing';}
		renderStep();updateStepsBar();
	}
}

// ==================== RENDER STEP ====================
function renderStep(){
const pc=document.getElementById('panelContent');const s=STEPS[currentStep];
let h=s.id==='boasvindas'?'':'<div class="step-title">'+s.icon+' Etapa '+(currentStep+1)+': '+s.label+'</div>';
switch(s.id){
case 'boasvindas':h+=renderBoasvindas();break;
case 'setup':h+=renderSetup();break;
case 'identidade':h+=renderIdentidade();break;
case 'cores':h+=renderCores();break;
case 'textos':h+=renderTextos();break;
case 'contato':h+=renderContato();break;
case 'imagens':h+=renderImagens();break;
case 'avaliacoes':h+=renderAvaliacoes();break;
case 'planos':h+=renderPlanos();break;
case 'publicar':h+=renderPublicar();break;
}
pc.innerHTML=h;updateStepsBar();
// Layout: setup ocupa tela cheia (sem preview)
toggleSetupLayout(s.id==='boasvindas'||s.id==='setup');
// bind color pickers after render
if(s.id==='setup')setTimeout(()=>previewSetupPalette(),50);
if(s.id==='cores')bindColorPickers();
}

function toggleSetupLayout(isSetup){
const preview=document.querySelector('.preview');
const panel=document.querySelector('.panel');
const main=document.querySelector('.main');
const panelContent=document.getElementById('panelContent');
const panelNav=document.querySelector('.panel-nav');
const stepsBar=document.getElementById('stepsBar');
const btnPrev=document.getElementById('btnPrev');
const btnNext=document.getElementById('btnNext');
if(isSetup){
// Esconde preview, steps, nav e botão exportar
if(preview)preview.style.display='none';
if(stepsBar)stepsBar.style.display='none';
if(panelNav)panelNav.style.display='none';
const btnExp=document.getElementById('btnExport');if(btnExp)btnExp.style.display='none';
// Painel centralizado como card
if(panel){panel.style.width='100%';panel.style.borderLeft='none';panel.style.background='transparent';panel.style.backdropFilter='none';}
if(main)main.style.justifyContent='center';
if(panelContent){panelContent.style.display='flex';panelContent.style.alignItems='flex-start';panelContent.style.justifyContent='center';panelContent.style.padding='32px 24px';}
// Envolve conteúdo em card estilizado
const existing=document.querySelector('.setup-card');
if(!existing&&panelContent){
const wrapper=document.createElement('div');wrapper.className='setup-wrapper';
const card=document.createElement('div');card.className='setup-card';
while(panelContent.firstChild){card.appendChild(panelContent.firstChild);}
wrapper.appendChild(card);panelContent.appendChild(wrapper);
}
}else{
if(preview)preview.style.display='';
if(stepsBar)stepsBar.style.display='';
if(panelNav)panelNav.style.display='';
const btnExp=document.getElementById('btnExport');if(btnExp)btnExp.style.display='';
if(panel){panel.style.width='';panel.style.borderLeft='';panel.style.background='';panel.style.backdropFilter='';}
if(main)main.style.justifyContent='';
if(panelContent){panelContent.style.display='';panelContent.style.alignItems='';panelContent.style.justifyContent='';panelContent.style.padding='';}
// Remove wrapper se existir
const wrapper=document.querySelector('.setup-wrapper');
if(wrapper){
const card=wrapper.querySelector('.setup-card');
if(card){while(card.firstChild){panelContent.appendChild(card.firstChild);}}
wrapper.remove();
}
}
}

async function iniciarPagamento(){
var nome = document.getElementById('cad-nome').value.trim();
var studio = document.getElementById('cad-studio').value.trim();
var email = document.getElementById('cad-email').value.trim();
var cpfCnpj = document.getElementById('cad-cpfcnpj').value.replace(/\D/g,'');
var msg = document.getElementById('cad-msg');
var btn = document.getElementById('btn-start-pay');

if (!nome || nome.length < 2) { if(msg) msg.innerHTML = '<span style=\"color:var(--error)\">⚠️ Informe seu nome completo.</span>'; return; }
if (!studio || studio.length < 2) { if(msg) msg.innerHTML = '<span style=\"color:var(--error)\">⚠️ Informe o nome do estúdio.</span>'; return; }
if (!email || !email.includes('@')) { if(msg) msg.innerHTML = '<span style=\"color:var(--error)\">⚠️ Informe um email válido.</span>'; return; }
if (!cpfCnpj || cpfCnpj.length < 11) { if(msg) msg.innerHTML = '<span style=\"color:var(--error)\">⚠️ Informe seu CPF (11 dígitos) ou CNPJ (14 dígitos).</span>'; return; }

if (btn) { btn.textContent = '⏳ Enviando...'; btn.disabled = true; }
if (msg) msg.innerHTML = '<span style=\"color:var(--dim)\">⏳ Validando seus dados...</span>';

// Salva os dados para uso no setup e na cobrança
edits.landing.textos['logo-text'] = studio;
localStorage.setItem('cad_nome', nome);
localStorage.setItem('cad_studio', studio);
localStorage.setItem('cad_email', email);
localStorage.setItem('cad_cpfcnpj', cpfCnpj);

// Envia para o webhook do n8n (não bloqueia o fluxo se falhar)
try {
await fetch(WEBHOOK_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ nome: nome, studio: studio, email: email, cpfCnpj: cpfCnpj, data: new Date().toISOString() })
});
if (msg) msg.innerHTML = '<span style=\"color:var(--green)\">✅ Dados validados! Gerando cobrança...</span>';
} catch(e) {
if (msg) msg.innerHTML = '<span style=\"color:var(--dim)\">⏳ Gerando cobrança...</span>';
}

// Salva lead no painel admin (paralelo, nao bloqueia)
try {
fetch('/api/salvar-lead', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ nome: nome, studio: studio, email: email, cpfCnpj: cpfCnpj })
});
} catch(e) {}

// Prossegue para pagamento com os dados coletados
startPayment(nome, studio, email, cpfCnpj);
}

async function verificarPagamento(){
const nomeSlug=localStorage.getItem('asaas_client_slug')||slugify(edits.landing.textos['logo-text']||'cliente');
const paymentId=localStorage.getItem('asaas_payment_id')||PAYMENT_ID;
const btn=document.getElementById('btn-verify');
const area=document.getElementById('payment-area');
const debugEl=document.getElementById('poll-debug');
if(btn){btn.textContent='⏳ Verificando...';btn.disabled=true;}

let pago=false;
let msg='';

// Chama nossa API interna (serverless function) que consulta o Asaas no backend
// Sem CORS, sem token exposto no frontend
try{
const res=await fetch('/api/verificar-pagamento?id='+encodeURIComponent(paymentId));
if(res.ok){
const json=await res.json();
pago=json.pago;
msg=json.pago
  ? ('✅ Encontrado: '+json.total+' pagamento(s)')
  : ('⏳ Nenhum pagamento ainda'+(json.erro?' | '+json.erro:''));
if(debugEl)debugEl.textContent=msg;
}else{
msg='Erro HTTP '+res.status;
if(debugEl)debugEl.textContent='⚠️ '+msg;
}
}catch(e){
msg='Erro de rede: '+e.message;
if(debugEl)debugEl.textContent='⚠️ '+msg;
}

const areaEl=area||document.getElementById('payment-area');
if(pago){
// Parar polling automático
if(window._pollInterval){clearInterval(window._pollInterval);window._pollInterval=null;}
localStorage.setItem('pagamento_ok_'+nomeSlug,'true');
if(areaEl)areaEl.innerHTML='<div style="background:rgba(32,201,151,.08);border:1px solid rgba(32,201,151,.2);border-radius:var(--r-card);padding:24px;text-align:center"><div style="font-size:48px;margin-bottom:12px">🎉</div><p style="font-size:16px;color:var(--green);font-weight:700;margin-bottom:4px">Pagamento confirmado!</p><p style="font-size:12px;color:var(--dim);margin-bottom:16px">Seu acesso foi liberado.</p><button class="btn btn-p" onclick="goToStep(1)" style="width:100%;padding:14px;font-size:15px">🚀 Começar a Criar Meu Site →</button></div>';
}else{
if(btn){btn.textContent='🔍 Verificar Novamente';btn.disabled=false;}
const statusBox=document.getElementById('payment-status-box');
if(statusBox){
const tentativas=((parseInt(localStorage.getItem('poll_tentativas')||'0'))+1);
localStorage.setItem('poll_tentativas',tentativas);
statusBox.innerHTML='<p style="font-size:20px;margin-bottom:8px">⏳</p>'+
'<p style="font-size:13px;font-weight:600;color:var(--bright);margin-bottom:6px">Aguardando pagamento...</p>'+
'<p style="font-size:11px;color:var(--dim);line-height:1.6">Verificamos a cada <strong style="color:var(--bright)">10 segundos</strong>. PIX confirma em até 30s após o pagamento.</p>'+
'<p style="font-size:10px;color:var(--dim);margin-top:6px">🔍 Tentativa #'+tentativas+' | '+msg+'</p>';
}
}
}

// Verificação silenciosa ao carregar a página — não confia em cache
async function verificarPagamentoAoCarregar(nomeSlug){
		if (isAdmin) return;
	var paymentId = localStorage.getItem("asaas_payment_id");
	if (!paymentId) return; // sem cobrança ativa, não faz nada
	try {
		var res = await fetch("/api/verificar-pagamento?id=" + encodeURIComponent(paymentId));
		if (res.ok) {
			var json = await res.json();
			if (json.pago) {
				localStorage.setItem("pagamento_ok_" + nomeSlug, "true");
				var section = document.getElementById("boasvindas-pay-section");
				if (section) {
					section.innerHTML = '<div style="background:rgba(32,201,151,.06);border:1px solid rgba(32,201,151,.2);border-radius:var(--r);padding:14px;text-align:center;margin-bottom:16px"><p style="font-size:12px;color:var(--green)">✅ Pagamento confirmado! Você já pode continuar.</p></div>' +
					'<button class="btn btn-p" onclick="goToStep(1)" style="width:100%;padding:16px;font-size:15px">🚀 Ir para Pré-Configuração →</button>';
				}
				if (window._pollInterval) { clearInterval(window._pollInterval); window._pollInterval = null; }
			} else {
				localStorage.removeItem("pagamento_ok_" + nomeSlug);
			}
		}
	} catch (e) {}
}

function setupBulkGaleria(input){

updatePreview();
var prev=document.getElementById('setup-galeria-preview');

}
processFileToWebP(files[processed],function(dataUrl){
edits.landing.imagens['gal-'+processed]=dataUrl;
edits.planos.imagens['gal-'+processed]=dataUrl;
processed++;
processNext();
},function(){processed++;processNext();});
}
processNext();
}

// --- REMOÇÃO DE FUNDO DA LOGO (Canvas) ---
function removeLogoBackground(){
// Prioriza dados do edit, depois preview, depois input
let logoData=edits.landing.imagens['logo'];
if(!logoData||logoData.startsWith('[')){
const prev=document.getElementById('su-logo-prev');
if(prev&&prev.src&&prev.src.startsWith('data:'))logoData=prev.src;
}
if(!logoData||logoData.startsWith('[')){alert('Faça upload da logo primeiro.');return;}
const img=new Image();
img.crossOrigin='anonymous';
img.onload=function(){
const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;
const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
const data=imgData.data;
let bgR=0,bgG=0,bgB=0,bgCount=0;
const sampleEdge=(x,y)=>{
const i=(y*canvas.width+x)*4;
bgR+=data[i];bgG+=data[i+1];bgB+=data[i+2];bgCount++;
};
// Amostra densa das 4 bordas para detectar cor de fundo
for(let x=0;x<canvas.width;x+=3){sampleEdge(x,0);sampleEdge(x,canvas.height-1);}
for(let y=0;y<canvas.height;y+=3){sampleEdge(0,y);sampleEdge(canvas.width-1,y);}
bgR=Math.round(bgR/bgCount);bgG=Math.round(bgG/bgCount);bgB=Math.round(bgB/bgCount);
// Remove fundo: pixels próximos da cor detectada → transparentes
const innerT=35,outerT=50;
for(let i=0;i<data.length;i+=4){
const dr=data[i]-bgR,dg=data[i+1]-bgG,db=data[i+2]-bgB;
const dist=Math.sqrt(dr*dr+dg*dg+db*db);
if(dist<innerT){data[i+3]=0;}
else if(dist<outerT){data[i+3]=Math.round(((dist-innerT)/(outerT-innerT))*255);}
}
ctx.putImageData(imgData,0,0);
const newUrl=canvas.toDataURL('image/png');
edits.landing.imagens['logo']=newUrl;edits.planos.imagens['logo']=newUrl;
edits.landing.imagens['logo-hero']=newUrl;edits.planos.imagens['logo-hero']=newUrl;
document.getElementById('su-logo-url').value='[Logo sem fundo]';
const prev=document.getElementById('su-logo-prev');if(prev){prev.src=newUrl;}
updatePreview();
};
img.src=logoData;
}

function buildPageHTML(page,noindex){
const e=edits[page];const parser=new DOMParser();const doc=parser.parseFromString(templateData[page],'text/html');
// Noindex para página de planos (não indexar no Google)
if(noindex){const meta=doc.createElement('meta');meta.name='robots';meta.content='noindex,nofollow';doc.head.appendChild(meta);}
// Favicon dinâmico — círculo na cor mais escura da marca
const corEscura=e.cores['cor-escuro']||'#3A2D28';
const faviconSVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="'+corEscura+'"/></svg>';
const faviconURL='data:image/svg+xml,'+encodeURIComponent(faviconSVG);
const faviconEl=doc.querySelector('link[rel="icon"]');
if(faviconEl)faviconEl.setAttribute('href',faviconURL);
let css=':root{';for(const[k,v]of Object.entries(e.cores))css+=`--${k}:${v};`;css+='}';
let styleEl=doc.getElementById('wb-colors');if(!styleEl){styleEl=doc.createElement('style');styleEl.id='wb-colors';doc.head.appendChild(styleEl);}
styleEl.textContent=css;
	const otherPage=page==="landing"?"planos":"landing";const imOther=(edits[otherPage]&&edits[otherPage].imagens)||{};
for(const[k,v]of Object.entries(e.imagens)){let val=v;if(!val||val.startsWith('[')){val=imOther[k];}if(!val||val.startsWith('['))continue;const imgEl=doc.querySelector(`[data-editable="${k}"]`);if(imgEl&&imgEl.tagName==='IMG')imgEl.setAttribute('src',val);}
for(const[k,v]of Object.entries(e.imagens)){let val2=v;if(!val2||val2.startsWith('[')){val2=imOther[k];}if(!val2||val2.startsWith('['))continue;doc.querySelectorAll(`[data-editable-bg="${k}"]`).forEach(el=>{el.style.backgroundImage=`url("${val2}")`;});}
for(const[k,v]of Object.entries(e.textos)){
const textEls=doc.querySelectorAll(`[data-editable-text="${k}"]`);if(textEls.length>0){textEls.forEach(el=>{el.textContent=v;});continue;}
const el=doc.querySelector(`[data-editable="${k}"]`);if(!el)continue;
if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.setAttribute('value',v);el.value=v;}else if(el.children.length===0){el.textContent=v;}
}
doc.querySelectorAll('[data-editable-html]').forEach(el=>{const k=el.getAttribute('data-editable-html');if(k&&e.textos[k])el.innerHTML=e.textos[k];});
for(const[k,v]of Object.entries(e.links)){const el=doc.querySelector(`[data-editable="${k}"]`);if(el&&el.tagName==='A')el.setAttribute('href',v);}
doc.querySelectorAll('[data-editable],[data-editable-text],[data-editable-bg],[data-editable-html]').forEach(el=>{el.removeAttribute('data-editable');el.removeAttribute('data-editable-text');el.removeAttribute('data-editable-bg');el.removeAttribute('data-editable-html');});
const s=doc.getElementById('wb-colors');if(s)s.removeAttribute('id');
let html='<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
if(customCode.head)html=html.replace('<!-- CUSTOM_HEAD -->',customCode.head);
if(customCode.bodyStart)html=html.replace('<!-- CUSTOM_BODY_START -->',customCode.bodyStart);
if(customCode.footer)html=html.replace('<!-- CUSTOM_FOOTER -->',customCode.footer);
return html;
}

// ==================== FIELD HELPERS ====================
function field(key,label,placeholder){
const e=edits[currentPage];let v='';
if(e.textos[key]!==undefined)v=e.textos[key];
else if(e.links[key]!==undefined)v=e.links[key];
return `<div class="fg"><label class="fl">${label}</label><input class="fi" value="${esc(v||'')}" data-tkey="${key}" placeholder="${placeholder||''}" oninput="updateField('${key}',this.value)"></div>`;
}

function imageField(key,label){
const v=edits[currentPage].imagens[key]||'';
let h=`<div class="fg"><label class="fl">${label}</label>`;
h+=`<div style="display:flex;gap:4px"><input class="fi" value="${esc(v)}" data-ikey="${key}" oninput="updateImage('${key}',this.value)" placeholder="URL da imagem...">`;
h+=`<label class="upload-btn">📁<input type="file" accept="image/*,.heic,.heif" onchange="uploadImage('${key}',this)"></label></div>`;
h+=`<img class="img-prev" src="${v}" onerror="this.style.display='none'" onload="this.style.display='block'" ${v?'':'style="display:none"'} data-preview="${key}"></div>`;
return h;
}

// Helper: detecta HEIC e converte para WebP
function processFileToWebP(file,callback,onError){
	const isHEIC=file.name&&(file.name.toLowerCase().endsWith(".heic")||file.name.toLowerCase().endsWith(".heif")||file.type==="image/heic"||file.type==="image/heif");
	if(isHEIC){
		if(typeof heic2any==="undefined"){if(onError)onError("Biblioteca HEIC nao carregada.");return;}
		heic2any({blob:file,toType:"image/jpeg",quality:0.92}).then(function(result){
			const blob=Array.isArray(result)?result[0]:result;
			const url=URL.createObjectURL(blob);
			const img=new Image();
			img.onerror=function(){if(onError)onError("Erro ao decodificar HEIC.");};
			img.onload=function(){
				const c=document.createElement("canvas");const mw=1200,mh=1200;
				let w=img.width,h=img.height;
				if(w>mw){h*=(mw/w);w=mw;}if(h>mh){w*=(mh/h);h=mh;}
				c.width=w;c.height=h;
				c.getContext("2d").drawImage(img,0,0,w,h);
				callback(c.toDataURL("image/webp",0.82));
				URL.revokeObjectURL(url);
			};img.src=url;
		}).catch(function(err){if(onError)onError("Erro HEIC: "+(err.message||"formato invalido"));});
		return;
	}
	// Fluxo normal (JPEG, PNG, WebP)
	const reader=new FileReader();
	reader.onerror=function(){if(onError)onError("Erro ao ler arquivo.");};
	reader.onload=function(e){
		const img=new Image();
		img.onerror=function(){if(onError)onError("Erro ao carregar imagem.");};
		img.onload=function(){
			const c=document.createElement("canvas");const mw=1200,mh=1200;
			let w=img.width,h=img.height;
			if(w>mw){h*=(mw/w);w=mw;}if(h>mh){w*=(mh/h);h=mh;}
			c.width=w;c.height=h;
			c.getContext("2d").drawImage(img,0,0,w,h);
			callback(c.toDataURL("image/webp",0.82));
		};img.src=e.target.result;
	};
	reader.readAsDataURL(file);
}

function uploadImage(key,input){
	const file=input.files[0];if(!file)return;
	const btn=input.closest("label");
	const origText=btn?btn.textContent:"";
	if(btn){btn.textContent="⏳";btn.style.pointerEvents="none";}
	processFileToWebP(file,function(dataUrl){
		edits.landing.imagens[key]=dataUrl;
		edits.planos.imagens[key]=dataUrl;
		const prev=document.querySelector("[data-preview=\""+key+"\"]");if(prev){prev.src=dataUrl;prev.style.display="block";}
		const urlInput=document.querySelector("[data-ikey=\""+key+"\"]");if(urlInput)urlInput.value="[Imagem Upload]";
		updatePreview();
		if(btn){btn.textContent=origText;btn.style.pointerEvents="";}
	},function(err){
		alert(err);
		if(btn){btn.textContent=origText;btn.style.pointerEvents="";}
	});
}

let previewTimer;
function schedulePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(updatePreview,300);}

// Aplica paleta nas DUAS páginas

edits.planos.cores=JSON.parse(JSON.stringify(preset.colors));
document.querySelectorAll('[data-ckey]').forEach(input=>{
const v=preset.colors[input.dataset.ckey];if(v){input.value=v;const cv=input.parentElement.querySelector('.cv');if(cv)cv.textContent=v;}
});
updatePreview();
}

// ==================== PREVIEW ====================
function updatePreview(){
const raw=templateData[currentPage];if(!raw)return;
const parser=new DOMParser();const doc=parser.parseFromString(raw,'text/html');
const e=edits[currentPage];
let css=':root{';for(const[k,v]of Object.entries(e.cores))css+=`--${k}:${v};`;css+='}';
let styleEl=doc.getElementById('wb-colors');if(!styleEl){styleEl=doc.createElement('style');styleEl.id='wb-colors';doc.head.appendChild(styleEl);}
styleEl.textContent=css;
	const otherPage2=currentPage==="landing"?"planos":"landing";const imOther2=(edits[otherPage2]&&edits[otherPage2].imagens)||{};
for(const[k,v]of Object.entries(e.imagens)){let val=v;if(!val){val=imOther2[k];}if(!val)continue;const imgEl=doc.querySelector(`[data-editable="${k}"]`);if(imgEl&&imgEl.tagName==='IMG')imgEl.setAttribute('src',val);}
for(const[k,v]of Object.entries(e.imagens)){let val2=v;if(!val2){val2=imOther2[k];}if(!val2)continue;doc.querySelectorAll(`[data-editable-bg="${k}"]`).forEach(el=>{el.style.backgroundImage=`url("${val2}")`;});}
for(const[k,v]of Object.entries(e.textos)){
const textEls=doc.querySelectorAll(`[data-editable-text="${k}"]`);if(textEls.length>0){textEls.forEach(el=>{el.textContent=v;});continue;}
const el=doc.querySelector(`[data-editable="${k}"]`);if(!el)continue;
if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.setAttribute('value',v);el.value=v;}else if(el.children.length===0){el.textContent=v;}
}
doc.querySelectorAll('[data-editable-html]').forEach(el=>{const k=el.getAttribute('data-editable-html');if(k&&e.textos[k])el.innerHTML=e.textos[k];});
for(const[k,v]of Object.entries(e.links)){const el=doc.querySelector(`[data-editable="${k}"]`);if(el&&el.tagName==='A')el.setAttribute('href',v);}
let html='<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
if(customCode.head)html=html.replace('<!-- CUSTOM_HEAD -->',customCode.head);
if(customCode.bodyStart)html=html.replace('<!-- CUSTOM_BODY_START -->',customCode.bodyStart);
if(customCode.footer)html=html.replace('<!-- CUSTOM_FOOTER -->',customCode.footer);
const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);
const iframe=document.getElementById('previewFrame');const old=iframe.src;iframe.src=url;
if(old.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(old),1000);
}

// Admin: copiar HTML
async function adminCopiarHTML(pag){
var m=document.getElementById('admin-copy-msg');
try{
var html='';
if(pag==='ambos'){html='=== LANDING PAGE (index.html) ===\n\n'+buildPageHTML('landing',false)+'\n\n=== PLANOS (planos.html) ===\n\n'+buildPageHTML('planos',true)+'\n\n=== vercel.json ===\n\n'+JSON.stringify({cleanUrls:true,trailingSlash:false},null,2);}
else{html=buildPageHTML(pag,pag==='planos');}
await navigator.clipboard.writeText(html);
var nome=pag==='ambos'?'Ambos':(pag==='landing'?'Landing':'Planos');
m.innerHTML='<span style="color:var(--green)">✅ '+nome+' copiado! ('+Math.round(html.length/1024)+' KB)</span>';
setTimeout(function(){m.innerHTML='';},3000);
}catch(e){m.innerHTML='<span style="color:var(--error)">❌ '+esc(e.message)+'</span>';}
}

// ==================== EXPORT ====================
function exportAll(){
['landing','planos'].forEach(page=>{
const html=buildPageHTML(page,page==='planos');
const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=page==='landing'?'landing-page.html':'pagina-planos.html';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
});
}

document.getElementById('previewLabel').textContent=page==='landing'?'Landing Page':'Página de Planos';

}

function setSize(w,btn){

document.querySelectorAll('.szbtns button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
if(w==='100%'){iframe.style.width='100%';iframe.style.height='100%';}else{iframe.style.width=w;iframe.style.height='100%';}

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();exportAll();}});
