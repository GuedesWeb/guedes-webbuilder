<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Guedes WebBuilder — Admin</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #1e1e2e;
  --text: #cdd6f4;
  --bright: #ffffff;
  --dim: #6c7086;
  --accent: #4c43f7;
  --green: #20c997;
  --warning: #f59e0b;
  --error: #ef4444;
  --r: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.login-container{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:400px}
.login-box h1{font-size:20px;color:var(--bright);margin-bottom:6px;text-align:center}
.login-box p{font-size:12px;color:var(--dim);margin-bottom:24px;text-align:center}
.login-box input{width:100%;padding:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r);color:var(--bright);font-size:14px;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:var(--accent)}
.login-box button{width:100%;padding:14px;background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-box .erro{color:var(--error);font-size:12px;text-align:center;margin-top:10px}
.logo{text-align:center;margin-bottom:20px}
.logo img{max-width:160px;height:auto}

.dashboard{max-width:1200px;margin:0 auto;padding:24px}
.dashboard header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.dashboard header h1{font-size:22px;color:var(--bright)}
.dashboard header button{padding:10px 20px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r);color:var(--text);cursor:pointer;font-size:13px}
.dashboard header button:hover{background:rgba(255,255,255,.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.stat .number{font-size:32px;font-weight:700;color:var(--bright)}
.stat .label{font-size:12px;color:var(--dim);margin-top:4px}
.stat.green .number{color:var(--green)}
.stat.warning .number{color:var(--warning)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
thead{background:rgba(255,255,255,.02)}
th{text-align:left;padding:14px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);font-weight:600}
td{padding:12px 16px;font-size:13px;border-top:1px solid var(--border)}
td a{color:var(--accent);text-decoration:none;font-size:12px}
td a:hover{text-decoration:underline}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.pago{background:rgba(32,201,151,.12);color:var(--green)}
.badge.pendente{background:rgba(245,158,11,.12);color:var(--warning)}
.loading{text-align:center;padding:40px;color:var(--dim)}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:14px}
.logo-sm{max-width:24px;height:auto;vertical-align:middle}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="login-container">
<div class="login-box">
<div class="logo"><img src="assets/Group 8.svg" alt="Guedes"></div>
<h1>Painel Admin</h1>
<p>Área restrita — Guedes WebBuilder</p>
<input type="email" id="login-email" placeholder="Email">
<input type="password" id="login-pass" placeholder="Senha" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">Entrar</button>
<p class="erro" id="login-erro"></p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="dashboard" style="display:none">
<header>
<div style="display:flex;align-items:center;gap:12px">
<img src="assets/Group 8.svg" alt="Guedes" style="max-width:28px;height:auto">
<h1>Painel Admin</h1>
</div>
<button onclick="logout()">🚪 Sair</button>
</header>

<div class="stats" id="stats"></div>

<div style="margin-bottom:16px">
<button onclick="carregarLeads()" style="padding:8px 16px;background:var(--accent);border:none;border-radius:var(--r);color:#fff;cursor:pointer;font-size:12px">🔄 Atualizar</button>
</div>

<div id="tabela-container">
<div class="loading">⏳ Carregando...</div>
</div>
</div>

<script>
var token = localStorage.getItem('admin_token');

// Se já tem token, tenta ir direto pro dashboard
if (token) { verificarToken(); }

async function login() {
var email = document.getElementById('login-email').value.trim();
var pass = document.getElementById('login-pass').value.trim();
var erro = document.getElementById('login-erro');
if (!email || !pass) { erro.textContent = 'Preencha email e senha.'; return; }

try {
var res = await fetch('/api/admin-login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ email: email, password: pass })
});
var json = await res.json();
if (res.ok && json.token) {
token = json.token;
localStorage.setItem('admin_token', token);
document.getElementById('login-screen').style.display = 'none';
document.getElementById('dashboard-screen').style.display = 'block';
carregarLeads();
} else {
erro.textContent = json.erro || 'Erro ao fazer login.';
}
} catch(e) {
erro.textContent = 'Erro de conexão.';
}
}

async function verificarToken() {
// Tenta carregar leads pra ver se token é válido
try {
var res = await fetch('/api/admin-leads', { headers: { 'Authorization': 'Bearer ' + token } });
if (res.ok) {
document.getElementById('login-screen').style.display = 'none';
document.getElementById('dashboard-screen').style.display = 'block';
carregarLeads();
} else {
localStorage.removeItem('admin_token');
token = null;
}
} catch(e) {}
}

function logout() {
localStorage.removeItem('admin_token');
token = null;
document.getElementById('login-screen').style.display = 'flex';
document.getElementById('dashboard-screen').style.display = 'none';
}

async function carregarLeads() {
var container = document.getElementById('tabela-container');
container.innerHTML = '<div class="loading">⏳ Carregando...</div>';

try {
var res = await fetch('/api/admin-leads', { headers: { 'Authorization': 'Bearer ' + token } });
if (res.status === 401) {
logout();
return;
}
var json = await res.json();

// Stats
document.getElementById('stats').innerHTML =
'<div class="stat"><div class="number">' + json.total + '</div><div class="label">Total de Leads</div></div>' +
'<div class="stat green"><div class="number">' + json.pagos + '</div><div class="label">Pagos</div></div>' +
'<div class="stat warning"><div class="number">' + json.pendentes + '</div><div class="label">Pendentes</div></div>';

if (!json.leads || json.leads.length === 0) {
container.innerHTML = '<div class="empty">📭 Nenhum lead cadastrado ainda.</div>';
return;
}

var html = '<table><thead><tr>' +
'<th>Data</th><th>Nome</th><th>Estúdio</th><th>Email</th><th>CPF/CNPJ</th><th>Status</th><th>Etapa</th><th>Ações</th>' +
'</tr></thead><tbody>';

json.leads.forEach(function(l) {
var statusClass = l.pago ? 'pago' : 'pendente';
var statusText = l.pago ? 'Pago' : 'Pendente';
var data = l.criadoEm ? new Date(l.criadoEm).toLocaleDateString('pt-BR') : '-';
var acoes = '';
if (!l.pago && l.paymentId) {
acoes = '—';
} else if (l.pago) {
acoes = '✅';
} else {
acoes = '—';
}

html += '<tr>' +
'<td style="font-size:11px;color:var(--dim)">' + data + '</td>' +
'<td>' + esc(l.nome) + '</td>' +
'<td><strong style="color:var(--bright)">' + esc(l.studio) + '</strong></td>' +
'<td style="font-size:12px">' + esc(l.email) + '</td>' +
'<td style="font-size:11px;color:var(--dim)">' + esc(l.cpfCnpj || '-') + '</td>' +
'<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>' +
'<td style="font-size:11px">' + (l.etapa || 'cadastro') + '</td>' +
'<td>' + acoes + '</td>' +
'</tr>';
});

html += '</tbody></table>';
container.innerHTML = html;
} catch(e) {
container.innerHTML = '<div class="empty">❌ Erro ao carregar dados: ' + e.message + '</div>';
}
}

function esc(s) {
if (!s) return '';
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
